apiVersion: monitoring.zabbix.io/v1alpha1
kind: Zabbix
metadata:
  labels:
    app.kubernetes.io/name: zabbix-operator
    app.kubernetes.io/managed-by: kustomize
  name: zabbix-example22
  namespace: default
spec:
  agent: 
    image: zabbix/zabbix-agent:alpine-7.2-latest
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  server:
    image: zabbix/zabbix-server-mysql:7.2-alpine-latest
    resources:
      limits:
        cpu: 400m
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
    environment:
      DB_SERVER_HOST: mysql.default.svc.cluster.local
      DB_SERVER_PORT: "3306"
      DB_SERVER_DATABASE: zabbix
  web:
    image: zabbix/zabbix-web-nginx-mysql:7.2-alpine-latest
    resources:
      limits:
        cpu: 300m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    ingress:
      enabled: true
      className: traefik
      host: zabbix.lab4ever.xyz
      tls:
        enabled: true
        secretName: cloudflare-origin-cert
        hosts:
          - zabbix.lab4ever.xyz
  database:
    type: mysql # mysql or postgresql
    credentials:
      fromSecret: spring-datasource-secret

