---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - monitoring.zabbix.io
  resources:
  - zabbixes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.zabbix.io
  resources:
  - zabbixes/finalizers
  verbs:
  - update
- apiGroups:
  - monitoring.zabbix.io
  resources:
  - zabbixes/status
  verbs:
  - get
  - patch
  - update
