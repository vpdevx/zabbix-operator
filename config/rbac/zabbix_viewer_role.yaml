# permissions for end users to view zabbixes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: zabbix-operator
    app.kubernetes.io/managed-by: kustomize
  name: zabbix-viewer-role
rules:
- apiGroups:
  - monitoring.zabbix.io
  resources:
  - zabbixes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.zabbix.io
  resources:
  - zabbixes/status
  verbs:
  - get
